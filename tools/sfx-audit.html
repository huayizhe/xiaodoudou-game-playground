<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>音效试听 · 火柴人勇闯恶魔岛</title>
<style>
  :root{--ink:#07060d;--bone:#f3ede0;--red:#ff3b30;--line:rgba(255,255,255,.12)}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;background:radial-gradient(circle at 50% 0%,#1b1020,#08060e 60%,#05040a);
    color:var(--bone);font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif}
  body{padding:22px 18px 40px;max-width:1080px;margin:0 auto}
  h1{font-size:clamp(20px,3.4vw,30px);letter-spacing:.12em;margin-bottom:8px}
  h1 span{color:#ff5a4a}
  .sub{font-size:12.5px;line-height:1.75;color:rgba(243,237,224,.62);margin-bottom:18px}
  .note{background:rgba(255,90,90,.08);border:1px solid rgba(255,90,90,.28);border-radius:10px;
    padding:12px 14px;font-size:12.5px;line-height:1.8;color:#ffd9cf;margin-bottom:20px}
  .note b{color:#fff}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .pill{padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.06);
    border:1px solid var(--line);color:rgba(243,237,224,.82);font-size:13px;cursor:pointer}
  .pill.on{border-color:rgba(255,120,90,.7);background:rgba(255,59,48,.16);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .item{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;
    background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid var(--line);cursor:pointer;text-align:left;transition:.15s;position:relative}
  .item:hover{border-color:rgba(255,120,90,.55);transform:translateY(-1px)}
  .item:active{transform:scale(.98)}
  .item.playing{border-color:rgba(255,180,80,.8);box-shadow:0 0 18px rgba(255,120,60,.25)}
  .k{font-size:11px;letter-spacing:.14em;color:#ff8a6a;font-weight:700}
  .n{font-size:15px;font-weight:700;letter-spacing:.04em}
  .d{font-size:11.5px;line-height:1.6;color:rgba(243,237,224,.55)}
  .foot{margin-top:22px;font-size:12px;line-height:1.8;color:rgba(243,237,224,.42)}
</style>
</head>
<body>
<h1>音效<span>试听</span> · 单独回放</h1>
<p class="sub">每个按钮只播这一条音效。本页参数与 <code>stickman.html</code> 里的 <code>AudioSys</code> 保持一致，改游戏音效后这里要同步。</p>
<div class="note">
  <b>当前音色：</b>全部为你确认过的原版（普攻 1800→460Hz 暗刃风 + 220→90Hz 低频，命中 190→70Hz 方波）。
  底层保留不影响音色的修复：音频解锁、iOS interrupted 恢复、20ms 排程前瞻、媒体通道无声解锁与噪声缓冲缓存。
</div>
<div class="tools">
  <button class="pill" id="btnMusic">循环背景音乐（对照）</button>
  <button class="pill" id="btnMute">静音</button>
</div>
<div class="grid" id="grid"></div>
<p class="foot">全部音效由 Web Audio 实时合成，没有音频文件；本页不改游戏。</p>

<script>
(function(){
'use strict';
function beepWav(freq, dur, vol){
  const sr=8000, n=Math.max(1,Math.floor(sr*dur)), bytes=44+n*2;
  const ab=new ArrayBuffer(bytes), dv=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF'); dv.setUint32(4,bytes-8,true); ws(8,'WAVE'); ws(12,'fmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,sr,true); dv.setUint32(28,sr*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  ws(36,'data'); dv.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){
    const env=Math.min(1,i/80)*Math.min(1,(n-i)/200);
    dv.setInt16(44+i*2, Math.round(Math.sin(2*Math.PI*freq*i/sr)*vol*env*32767), true);
  }
  let bin=''; const u8=new Uint8Array(ab);
  for(let i=0;i<u8.length;i++) bin+=String.fromCharCode(u8[i]);
  return 'data:audio/wav;base64,'+btoa(bin);
}
const AudioSys = {
  ctx:null, master:null, musicGain:null, sfxGain:null, muted:false,
  musicEnabled:true, sfxEnabled:true, musicVol:.65, sfxVol:.9,
  musicOn:false, timer:null, step:0, nextT:0,
  init(){
    if(this.ctx){
      if(this.ctx.state==='suspended'||this.ctx.state==='interrupted'){ const p=this.ctx.resume(); if(p&&p.catch)p.catch(()=>{}); }
      this.unlockMedia();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.55;
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = this.musicEnabled ? this.musicVol : 0;
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = this.sfxEnabled ? this.sfxVol : 0;
      this.musicGain.connect(this.master);
      this.sfxGain.connect(this.master);
      this.master.connect(this.ctx.destination);
      const unlock = this.ctx.createBufferSource();
      unlock.buffer = this.ctx.createBuffer(1, 1, this.ctx.sampleRate);
      unlock.connect(this.ctx.destination);
      if(unlock.start) unlock.start(0);
      if(this.ctx.state==='suspended'||this.ctx.state==='interrupted'){ const p=this.ctx.resume(); if(p&&p.catch)p.catch(()=>{}); }
      this.unlockMedia();
    }catch(err){ this.ctx = null; }
  },
  unlockMedia(){
    try{
      if(!this._mediaUnlock){
        this._mediaUnlock = new Audio(beepWav(440, 0.05, 0));
        this._mediaUnlock.setAttribute('playsinline','');
        this._mediaUnlock.preload='auto';
      }
      const p=this._mediaUnlock.play(); if(p&&p.catch)p.catch(()=>{});
    }catch(_){}
  },
  setMuted(m){
    this.muted = m;
    if(this.master) this.master.gain.setTargetAtTime(m?0:0.55, this.ctx.currentTime, 0.05);
  },
  tone(o){
    if(!this.ctx || this.muted) return;
    if(o.music ? !this.musicEnabled : !this.sfxEnabled) return;
    const c=this.ctx, t=c.currentTime + Math.max(o.delay||0, 0.02);
    const osc=c.createOscillator(), g=c.createGain();
    osc.type = o.type||'sine';
    osc.frequency.setValueAtTime(o.f0||440, t);
    if(o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.f1), t+(o.dur||0.1));
    const v = o.vol==null?0.18:o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t+(o.atk||0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t+(o.dur||0.1));
    osc.connect(g); g.connect(o.music?this.musicGain:this.sfxGain);
    osc.start(t); osc.stop(t+(o.dur||0.1)+0.03);
  },
  noiseBuf(dur, flat){
    const c=this.ctx, key=dur.toFixed(3)+(flat?'f':'d')+c.sampleRate;
    this._nbuf = this._nbuf || Object.create(null);
    let buf = this._nbuf[key];
    if(!buf){
      const len = Math.max(1, Math.floor(c.sampleRate * dur));
      buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (flat ? 1 : (1 - i/len));
      this._nbuf[key] = buf;
    }
    return buf;
  },
  noise(o){
    if(!this.ctx || this.muted) return;
    if(o.music ? !this.musicEnabled : !this.sfxEnabled) return;
    const c=this.ctx, t=c.currentTime + Math.max(o.delay||0, 0.02), dur=o.dur||0.15;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf(dur, !!o.flat);
    const f = c.createBiquadFilter(); f.type = o.filter||'bandpass';
    f.frequency.setValueAtTime(o.f0||1200, t);
    if(o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t+dur);
    f.Q.value = o.q||1;
    const g = c.createGain();
    const v = o.vol==null?0.2:o.vol;
    g.gain.setValueAtTime(v, t);
    if(o.tail) g.gain.setValueAtTime(v, t+Math.min(o.tail, dur*0.7));
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(f); f.connect(g); g.connect(o.music?this.musicGain:this.sfxGain);
    src.start(t);
  },
  sfx(name, arg){
    if(!this.ctx || !this.sfxEnabled) return;
    if(this.ctx.state==='suspended'||this.ctx.state==='interrupted'){ const p=this.ctx.resume(); if(p&&p.catch)p.catch(()=>{}); }
    const now = this.ctx.currentTime;
    if(name==='hit'||name==='crit'){
      if(now - (this.lastHitAt||-9) < 0.03) return;
      this.lastHitAt = now;
    }
    switch(name){
      case 'slash':
        this.noise({dur:.15, f0:1800, f1:460, vol:.24, q:.8});
        this.tone({type:'triangle', f0:220, f1:90, dur:.08, vol:.11}); break;
      case 'slash2':
        this.noise({dur:.12, f0:1600, f1:380, vol:.21, q:.7});
        this.tone({type:'triangle', f0:260, f1:110, dur:.07, vol:.10}); break;
      case 'hit':
        this.tone({type:'square', f0:190, f1:70, dur:.09, vol:.14});
        this.noise({dur:.06, f0:900, vol:.1}); break;
      case 'crit':
        this.tone({type:'sawtooth', f0:320, f1:90, dur:.16, vol:.2});
        this.noise({dur:.12, f0:2200, f1:300, vol:.18});
        this.tone({type:'square', f0:1200, f1:520, dur:.06, vol:.1, delay:.01}); break;
      case 'zImpact':
        this.noise({dur:.34, f0:700, f1:2600, vol:.22, q:1.1});
        this.tone({type:'triangle', f0:165, f1:58, dur:.3, vol:.2});
        this.noise({dur:.15, f0:160, f1:70, vol:.18}); break;
      case 'xImpact':
        this.tone({type:'sine', f0:120, f1:34, dur:.34, vol:.32});
        this.noise({dur:.3, f0:520, f1:90, vol:.26});
        this.tone({type:'square', f0:210, f1:55, dur:.1, vol:.12}); break;
      case 'cImpact':
        this.noise({dur:.24, f0:3000, f1:220, vol:.26, q:1.5});
        this.tone({type:'sawtooth', f0:190, f1:48, dur:.2, vol:.22});
        this.tone({type:'sine', f0:76, f1:32, dur:.32, vol:.2, delay:.04}); break;
      case 'ultcut': {
        const n = arg||0;
        const f = 3200 + Math.min(10,n) * 130;
        this.noise({dur:.06, f0:f, f1:520, vol:.27, q:1.2});
        this.tone({type:'square', f0:170+n*16, f1:58, dur:.06, vol:.18});
        this.tone({type:'triangle', f0:760+n*40, f1:520, dur:.09, vol:.08, delay:.015});
        break;
      }
      case 'ultFinish':
        this.noise({dur:.5, f0:2600, f1:280, vol:.3, q:.8});
        this.tone({type:'sine', f0:112, f1:30, dur:.5, vol:.34});
        this.tone({type:'triangle', f0:440, f1:220, dur:.32, vol:.11, delay:.05}); break;
      case 'hurt':
        this.tone({type:'sawtooth', f0:260, f1:80, dur:.28, vol:.22});
        this.noise({dur:.2, f0:500, vol:.16}); break;
      case 'jump': this.tone({type:'sine', f0:280, f1:640, dur:.2, vol:.14}); break;
      case 'land':
        this.tone({type:'sine', f0:120, f1:38, dur:.35, vol:.3});
        this.noise({dur:.3, f0:400, f1:100, vol:.25}); break;
      case 'whip':
        this.noise({dur:.16, f0:3200, f1:600, vol:.2, q:2});
        this.tone({type:'triangle', f0:900, f1:300, dur:.14, vol:.1}); break;
      case 'spin':
        this.noise({dur:.4, f0:600, f1:2400, vol:.2, q:1.4});
        this.tone({type:'triangle', f0:200, f1:520, dur:.35, vol:.12}); break;
      case 'ult':
        this.tone({type:'sawtooth', f0:64, f1:34, dur:.42, vol:.3});
        this.noise({dur:.3, f0:180, f1:1600, vol:.18, q:.55});
        this.tone({type:'sine', f0:98, f1:62, dur:.5, vol:.28, delay:.14});
        this.tone({type:'triangle', f0:220, f1:220, dur:.5, vol:.14, delay:.14});
        this.tone({type:'triangle', f0:330, f1:330, dur:.5, vol:.12, delay:.14});
        this.tone({type:'sine', f0:440, f1:440, dur:.42, vol:.08, delay:.14});
        this.noise({dur:.32, f0:3600, f1:700, vol:.3, q:.9, delay:.14}); break;
      case 'heal':
        [523,659,784].forEach((f,i)=> this.tone({type:'sine', f0:f, f1:f*1.02, dur:.32, vol:.09, delay:i*0.06})); break;
      case 'pickup': this.tone({type:'triangle', f0:880, f1:1320, dur:.1, vol:.1}); break;
      case 'death':
        this.tone({type:'sine', f0:140, f1:32, dur:.7, vol:.3});
        this.noise({dur:.5, f0:600, f1:120, vol:.2}); break;
      case 'wave':
        this.tone({type:'sine', f0:587.33, f1:587.33, dur:.28, vol:.12});
        this.tone({type:'sine', f0:880, f1:880, dur:.44, vol:.1, delay:.15});
        this.tone({type:'triangle', f0:293.66, f1:293.66, dur:.36, vol:.045, delay:.02});
        this.noise({dur:.34, f0:220, f1:760, vol:.07, q:.6}); break;
      case 'ui': this.tone({type:'triangle', f0:660, f1:990, dur:.08, vol:.08}); break;
      case 'boss':
        this.tone({type:'sawtooth', f0:55, f1:90, dur:1.4, vol:.3});
        this.noise({dur:1.2, f0:200, f1:60, vol:.24}); break;
      case 'explode':
        this.tone({type:'sine', f0:90, f1:26, dur:.5, vol:.34});
        this.noise({dur:.45, f0:1200, f1:150, vol:.3}); break;
    }
  },
  startMusic(){
    if(this.musicOn || !this.ctx || !this.musicEnabled) return;
    this.musicOn = true;
    this.nextT = this.ctx.currentTime + 0.1;
    this.step = 0;
    const scale = [0,3,5,7,10];
    const tick = ()=>{
      if(!this.ctx || !this.musicEnabled){ this.musicOn=false; this.timer=null; return; }
      while(this.nextT < this.ctx.currentTime + 0.25){
        const s = this.step % 32;
        const t = this.nextT;
        if(s % 8 === 0) this.tone({type:'sine', f0:130, f1:44, dur:.22, vol:.22, delay:t-this.ctx.currentTime, music:true});
        if(s % 16 === 8) this.noise({dur:.12, f0:1800, f1:500, vol:.08, delay:t-this.ctx.currentTime, music:true});
        if(s % 4 === 2) this.noise({dur:.05, f0:6000, f1:8000, vol:.035, delay:t-this.ctx.currentTime, music:true});
        if(s % 2 === 0){
          const n = scale[(s/2)%scale.length];
          const f = 55 * Math.pow(2, n/12);
          this.tone({type:'triangle', f0:f, f1:f, dur:.24, vol:.075, delay:t-this.ctx.currentTime, music:true});
        }
        if(s % 4 === 0 && Math.random() < 0.55){
          const n = [0,3,5,7,10][Math.floor(Math.random()*5)] + 12;
          const f = 220 * Math.pow(2, n/12);
          this.tone({type:'sine', f0:f, f1:f*1.005, dur:.5, vol:.035, delay:t-this.ctx.currentTime, music:true});
        }
        this.nextT += 0.125;
        this.step++;
      }
      this.timer = setTimeout(tick, 60);
    };
    tick();
  }
};

const SOUNDS = [
  { id:'slash', name:'普攻挥砍（一二段）', en:'slash', desc:'自动锁敌普攻的前两段。1800→460Hz 噪声 + 220→90Hz 低频。' },
  { id:'slash2', name:'普攻挥砍（第三段）', en:'slash2', desc:'第三段更短更轻：1600→380Hz 噪声 + 260→110Hz 低频。' },
  { id:'hit', name:'普攻命中', en:'hit', desc:'每一刀打中敌人。190→70Hz 方波 0.09 秒 + 900Hz 噪声。' },
  { id:'crit', name:'重击 / 连击里程碑', en:'crit', desc:'20/50/100/200 连击时播。320→90Hz 锯齿 + 高频噪声。' },
  { id:'wave', name:'波次开始', en:'wave', desc:'关卡开场、每一波开始。D5→A5 两声正弦铃音 + 上扬空气声。' },
  { id:'boss', name:'BOSS 阶段切换', en:'boss', desc:'魔王进入二、三阶段时播。55Hz 锯齿深吼 1.4 秒 + 低频噪声。' },
  { id:'hurt', name:'玩家受伤', en:'hurt', desc:'被敌人打到时播。260→80Hz 锯齿扫频 + 噪声。' },
  { id:'jump', name:'跃起', en:'jump', desc:'X 裂地跃斩起跳。280→640Hz 正弦上滑。' },
  { id:'land', name:'落地', en:'land', desc:'120→38Hz 正弦 + 低频噪声。' },
  { id:'whip', name:'裂空投 / 鞭击', en:'whip', desc:'抓投与甩击。噪声 3200→600 + 三角波。' },
  { id:'spin', name:'旋风斩', en:'spin', desc:'Z 技能。噪声 600→2400 上扬 + 三角波 200→520。' },
  { id:'zImpact', name:'旋风斩命中', en:'zImpact', desc:'Z 收招环斩。噪声 700→2600 + 165→58Hz 低频。' },
  { id:'xImpact', name:'裂地跃斩命中', en:'xImpact', desc:'X 落地砸击。120→34Hz 正弦 + 噪声。' },
  { id:'cImpact', name:'裂空投命中', en:'cImpact', desc:'C 落点砸击。噪声 3000→220 + 锯齿 190→48。' },
  { id:'ult', name:'无影斩起手', en:'ult', desc:'V 大招：低频开场鼓 + 金属斩击 + 和弦余韵。' },
  { id:'ultcut', name:'无影斩逐斩', en:'ultcut', desc:'每一斩单独一声，音高随连斩数升高。' },
  { id:'ultFinish', name:'无影斩收尾', en:'ultFinish', desc:'最后一记剑气冲击波。' },
  { id:'heal', name:'回血 / 过关', en:'heal', desc:'523/659/784 三个正弦音。' },
  { id:'pickup', name:'拾取', en:'pickup', desc:'880→1320Hz 三角波。' },
  { id:'death', name:'敌人死亡 / 失败', en:'death', desc:'140→32Hz 正弦 + 噪声。' },
  { id:'ui', name:'按钮点击', en:'ui', desc:'660→990Hz 三角波，极短。' },
  { id:'explode', name:'爆炸 / 炸弹鬼', en:'explode', desc:'90→26Hz 正弦 + 噪声。' }
];

const grid = document.getElementById('grid');
for(const s of SOUNDS){
  const b = document.createElement('button');
  b.className = 'item';
  b.innerHTML = `<div class="k">${s.en}</div><div class="n">${s.name}</div><div class="d">${s.desc}</div>`;
  b.addEventListener('click', ()=>{
    AudioSys.init();
    AudioSys.sfx(s.id);
    document.querySelectorAll('.item.playing').forEach(x=>x.classList.remove('playing'));
    b.classList.add('playing');
    setTimeout(()=> b.classList.remove('playing'), 900);
  });
  grid.appendChild(b);
}

const btnMusic = document.getElementById('btnMusic');
btnMusic.addEventListener('click', ()=>{
  AudioSys.init();
  if(!AudioSys.musicOn){
    AudioSys.startMusic();
    btnMusic.classList.add('on');
    btnMusic.textContent = '停止背景音乐';
  } else {
    AudioSys.musicEnabled = false;
    AudioSys.musicOn = false;
    clearTimeout(AudioSys.timer);
    btnMusic.classList.remove('on');
    btnMusic.textContent = '循环背景音乐（对照）';
  }
});
const btnMute = document.getElementById('btnMute');
btnMute.addEventListener('click', ()=>{
  AudioSys.init();
  AudioSys.setMuted(!AudioSys.muted);
  btnMute.classList.toggle('on', AudioSys.muted);
  btnMute.textContent = AudioSys.muted ? '已静音' : '静音';
});
})();
</script>
</body>
</html>
